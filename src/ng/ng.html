<!-- SUBJECT GAMES (Life Science, Earth & Space, Physics): LEVEL PICKER, shared by all 12 games -->
<section class="screen" id="s-ngset" hidden>
  <div class="card">
    <div class="setupart" id="ngArt"></div><h2 id="ngTitle"></h2>
    <p class="sub" id="ngSub"></p>
    <ol class="howto" id="ngHow"></ol>
    <div class="sepstars" id="ngTotal"></div>
    <div class="seplevels" id="ngLevels"></div>
    <p><button class="btn ghost sm" id="ngSetBack">← Back</button></p>
  </div>
</section>

<!-- SUBJECT GAMES: PLAY (one screen; each game draws into ngMain and ngSide) -->
<section class="screen" id="s-ng" hidden>
  <div class="hud">
    <div class="pill">Level <b id="ngLvl">1</b>/<span id="ngLvlN">9</span></div>
    <div class="pill"><span id="ngMetricL">Tries</span> <b id="ngMetric">0</b></div>
    <div class="pill" id="ngTarget"></div>
    <button class="btn sm ghost" id="ngBack">← Levels</button>
  </div>
  <div class="card onescr ngcard">
    <div class="clue cacl"><b id="ngName" style="font-size:20px"></b><span id="ngStory"></span></div>
    <div class="evtop">
      <div class="coach" id="ngCoach" role="status" aria-live="polite"></div>
      <div class="evbtns"><button class="btn ghost sm" id="ngHint"><i data-ic="bulb"></i><span id="ngHintTxt">Need a hint?</span></button></div>
    </div>
    <div class="infobox" id="ngIntro" hidden></div>
    <div class="infobox hintfloat" id="ngHintBox" hidden></div>
    <div class="ngrid" id="ngGrid">
      <div class="ngmain" id="ngMain"></div>
      <div class="ngside" id="ngSide"></div>
    </div>
    <div class="spresult" id="ngResult" hidden></div>
  </div>
</section>

<!-- PRE-TEST / POST-TEST: mode choice, rules, result (source: src/ng/test.js) -->
<section class="screen" id="s-test" hidden>
  <div class="card tstcard" id="tstBody"></div>
</section>
