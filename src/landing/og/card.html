<!-- Share card source. Render it from the welcome/ folder at 1200x630 and save as welcome/img/og.jpg (paths are relative to welcome/). -->
<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:B;src:url(fonts/bricolage.woff2) format("woff2");font-weight:200 800;font-stretch:75% 100%}
@font-face{font-family:F;src:url(fonts/figtree.woff2) format("woff2");font-weight:300 900}
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;overflow:hidden;font-family:F;color:#c9d3ea;
background:radial-gradient(700px 420px at 90% 10%,rgba(106,63,214,.45),transparent 60%),radial-gradient(600px 400px at 0% 100%,rgba(20,130,74,.3),transparent 60%),#0a1430}
.l{position:absolute;left:64px;top:64px;width:560px}
.logo{display:flex;align-items:center;gap:14px;font:800 30px B;color:#fff}
.logo i{display:grid;place-items:center;width:52px;height:52px;border-radius:14px;background:#1c2a55;color:#ffc857;font-style:normal;font-size:24px;box-shadow:inset 0 0 0 2px #2f4380}
.logo sup{font-size:14px}
h1{font:780 60px/1.02 B;color:#fff;letter-spacing:-.02em;font-stretch:92%;margin:44px 0 22px}
h1 em{font-style:normal;color:#ffc857}
p{font-size:23px;line-height:1.4}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px}
.chips span{font-weight:700;font-size:17px;padding:8px 14px;border-radius:999px;color:#0a1430}
.d{position:absolute;border-radius:16px;padding:10px;background:linear-gradient(160deg,#1c2744,#0b1530);box-shadow:0 30px 60px -20px rgba(0,0,0,.7)}
.d img{display:block;border-radius:8px;width:100%}
</style></head><body>
<div class="l">
 <div class="logo"><img src="../icon.svg" width="58" height="58">Turn-Table<sup>™</sup></div>
 <h1>Middle school science games where <em>the science is the game.</em></h1>
 <p>24 standards-aligned games for grades 6 to 8, plus a live class quiz and Pre/Post growth reports.</p>
 <div class="chips"><span style="background:#7fe0ab">Life science</span><span style="background:#8fc3ff">Physics</span><span style="background:#ffc857">Chemistry</span><span style="background:#ffa38f">Earth &amp; space</span></div>
</div>
<div class="d" style="left:660px;top:58px;width:500px;transform:rotate(2deg)"><img src="img/moon.webp"></div>
<div class="d" style="left:700px;top:330px;width:440px;transform:rotate(-2deg)"><img src="img/livequiz.webp"></div>
</body></html>
