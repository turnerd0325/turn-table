<!-- BALANCE -->
<section class="screen" id="s-balance" hidden>
  <div class="hud">
    <div class="pill">Equation <b id="bcQ">1</b>/10</div>
    <div class="pill">Score <b id="bcScore">0</b></div>
    <div class="pill">Worth <b id="bcWorth">3</b> pts</div>
    <button class="btn sm ghost" id="bcQuit">Quit</button>
  </div>
  <div class="card bccard">
    <div class="bcmission"><small>Balance the scale. Atoms can't be lost or made, only rearranged!</small><b id="bcClue"></b></div>
    <div class="bceqrow" id="bcEq"></div>
    <div class="bcstage" id="bcStage"></div>
    <div class="bctally" id="bcTally"></div>
    <div class="infobox" id="bcHintBox" hidden></div>
    <div class="bcbtns">
      <button class="btn" id="bcCheck"><i data-ic="check"></i>Check it!</button>
      <button class="btn ghost" id="bcHint"><i data-ic="bulb"></i>Hint (−1 pt)</button>
      <button class="btn good" id="bcNext" hidden>Next ▶</button>
    </div>
    <div class="msg" id="bcMsg"></div>
  </div>
</section>
