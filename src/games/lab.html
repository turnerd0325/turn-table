<!-- LAB -->
<section class="screen" id="s-lab" hidden>
  <div class="hud">
    <div class="pill">Compound <b id="lbQ">1</b>/10</div>
    <div class="pill">Score <b id="lbScore">0</b></div>
    <div class="pill">Worth <b id="lbWorth">3</b> pts</div>
    <button class="btn sm ghost" id="lbQuit">Quit</button>
  </div>
  <div class="play has-side">
    <div id="lbTable"></div>
    <aside class="side">
      <div class="clue">Build this compound:<b id="lbName"></b><span id="lbClue"></span></div>
      <div class="beaker" id="lbBeaker"></div>
      <div class="formula" id="lbFormula"></div>
      <div class="tray" id="lbTray"></div>
      <div class="infobox" id="lbHintBox" hidden></div>
      <button class="btn" id="lbCombine"><i data-ic="flask"></i>Combine!</button>
      <div style="display:flex;gap:6px"><button class="btn ghost" id="lbHint"><i data-ic="bulb"></i>Hint (−1 pt)</button><button class="btn warn2" id="lbClear">Clear</button></div>
      <div class="msg" id="lbMsg"></div>
      <button class="btn good" id="lbNext" hidden>Next ▶</button>
    </aside>
  </div>
  <div id="lbLegend"></div>
</section>
